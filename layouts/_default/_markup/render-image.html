{{- $destination := .Destination -}}
{{- if hasPrefix $destination "/" -}}
  {{- $destination = strings.TrimPrefix "/" $destination | absURL -}}
  {{- $destination = printf "%s?v=20260721-2" $destination -}}
{{- end -}}
<img src="{{ $destination | safeURL }}" alt="{{ .Text }}"{{ with .Title }} title="{{ . }}"{{ end }}>
